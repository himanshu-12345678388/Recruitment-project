<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recruitment Assessment Portal</title>
  
  <!-- Professional Modern Font -->
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #f8fafc;
      color: #1e293b;
      font-family: 'Inter', -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .portal-screen-container {
      min-height: 100vh; /* Fixed typo here */
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
      background: radial-gradient(circle at top right, #eff6ff 0%, #f8fafc 100%);
    }

    .portal-card {
      width: 100%;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 40px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
      box-sizing: border-box;
    }
    .max-md { max-width: 440px; }
    .max-lg { max-width: 680px; }
    .max-xl { max-width: 960px; }

    .portal-h2 {
      font-size: 24px;
      font-weight: 700;
      color: #0f172a;
      margin: 0 0 8px 0;
      letter-spacing: -0.025em;
    }
    .portal-p-sub {
      font-size: 14px;
      color: #64748b;
      margin: 0 0 24px 0;
      line-height: 1.5;
    }
    .portal-header-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #64748b;
      border-bottom: 1px solid #f1f5f9;
      padding-bottom: 16px;
      margin-bottom: 24px;
    }
    .portal-meta-highlight {
      color: #2563eb;
      font-weight: 700;
    }

    .form-group {
      margin-bottom: 20px;
    }
    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #475569;
      margin-bottom: 8px;
    }
    .portal-input {
      width: 100%;
      padding: 12px 16px;
      background-color: #f1f5f9;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 14px;
      color: #1e293b;
      font-weight: 500;
      box-sizing: border-box;
    }
    .portal-input:focus {
      outline: none;
      border-color: #2563eb;
      background-color: #ffffff;
    }

    .btn-primary {
      width: 100%;
      padding: 14px 20px;
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-primary:hover { background-color: #1d4ed8; }

    .btn-option {
      width: 100%;
      padding: 16px;
      text-align: left;
      background-color: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      color: #334155;
      cursor: pointer;
      margin-bottom: 10px;
      box-sizing: border-box;
    }
    .btn-option:hover {
      background-color: #f1f5f9;
      border-color: #cbd5e1;
    }

    .split-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 32px;
      align-items: start;
    }
    .cipher-display {
      background-color: #0f172a;
      color: #38bdf8;
      font-family: monospace;
      font-size: 24px;
      font-weight: 700;
      padding: 24px;
      border-radius: 8px;
      text-align: center;
      letter-spacing: 0.1em;
      margin: 16px 0 24px 0;
    }
    .sidebar-panel {
      background-color: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 20px;
    }
    .sidebar-title {
      margin: 0 0 12px 0;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      color: #475569;
      text-align: center;
      border-b: 1px solid #e2e8f0;
      padding-bottom: 8px;
    }
    .sidebar-row {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      padding: 10px;
      border-radius: 6px;
      font-family: monospace;
      font-size: 14px;
      font-weight: 600;
      text-align: center;
      color: #334155;
      margin-bottom: 8px;
    }

    .matrix-status {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      padding: 6px 12px;
      border-radius: 6px;
      display: inline-block;
      margin-bottom: 24px;
    }
    .status-flash { background-color: #eff6ff; color: #2563eb; }
    .status-play { background-color: #ecfdf5; color: #059669; }
    
    .matrix-grid {
      display: grid;
      grid-template-columns: repeat(4, 72px);
      gap: 12px;
      justify-content: center;
      margin-top: 16px;
    }
    .matrix-tile {
      width: 72px;
      height: 72px;
      background-color: #f1f5f9;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      cursor: pointer;
    }
    .matrix-tile.flash { background-color: #2563eb; border-color: #1d4ed8; }
    .matrix-tile.match { background-color: #10b981; border-color: #059669; }

    .leaderboard-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 16px;
      font-size: 14px;
    }
    .leaderboard-table th {
      background-color: #f8fafc;
      border-bottom: 2px solid #e2e8f0;
      padding: 12px 16px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      color: #64748b;
    }
    .leaderboard-table td {
      padding: 16px;
      border-bottom: 1px solid #f1f5f9;
      color: #334155;
    }
    .row-self { background-color: #f0fdf4 !important; font-weight: 600; }
    .badge-self {
      background: #dcfce7;
      color: #15803d;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div id="root"></div>
</body>
</html>
